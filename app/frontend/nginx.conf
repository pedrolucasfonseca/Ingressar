map $http_user_agent $is_social_crawler {
    default 0;
    "~*facebookexternalhit|Twitterbot|WhatsApp|TelegramBot|Slackbot|LinkedInBot" 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/events/([^/]+)$ {
        if ($is_social_crawler) {
            proxy_pass http://api:3000/events/$1/preview;
        }
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        return 404;
    }
}